name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-internal-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure isolated loopback address on macOS
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.4 netmask 255.255.255.255
      - name: Verify internal Node.js CLI and loopback routing
        run: node --test skills/bdd-local-test/tests/internal-cli.test.cjs skills/bdd-local-test/tests/Test-McpRouteProbe.cjs

  verify:
    runs-on: windows-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for WebP tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Check tag, main ancestry, and plugin versions
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release tag must be vMAJOR.MINOR.PATCH: $tag"
          }

          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on main' }

          $version = $tag.Substring(1)
          foreach ($path in @('plugin.json', '.claude-plugin/plugin.json', '.codex-plugin/plugin.json')) {
            $manifest = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            if ($manifest.version -cne $version) {
              throw "$path has version $($manifest.version); expected $version"
            }
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-webp.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          $webp = python skills/bdd-local-test/scripts/lib/bdd_webp.py check | ConvertFrom-Json
          if (-not $webp.ok) { throw 'Pillow WebP encoder is unavailable' }
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
          Import-Module Pester -RequiredVersion 5.6.1 -ErrorAction Stop
          Invoke-Pester -Path skills/bdd-local-test/tests -CI

      - name: Run parallel BDD contract and summary checks
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-ParallelBdd.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Parallel BDD checks failed' }

      - name: Verify issue-scoped BDD selection
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-QualityPlan.ps1
          if ($LASTEXITCODE -ne 0) { throw 'BDD quality plan checks failed' }

      - name: Verify concurrent worktree allocation and MCP configuration
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-WorktreeMcp.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Worktree MCP checks failed' }

      - name: Verify automatic BDD ignore rules
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-BddGitignore.ps1
          if ($LASTEXITCODE -ne 0) { throw 'BDD ignore checks failed' }

      - name: Verify cross-project loopback allocation
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-CrossRepoSlot.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Cross-project loopback checks failed' }

      - name: Verify test browser cleanup
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-StopSlotServices.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Test browser cleanup checks failed' }

  release:
    needs: [verify, verify-internal-cli]
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes
