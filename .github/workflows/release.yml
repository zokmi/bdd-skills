name: Verify and Release

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-internal-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure isolated loopback address on macOS
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.4 netmask 255.255.255.255
      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts
      - name: Check generated configuration validator
        run: npm run check:config-validator
      - name: Check bundled ZIP runtime
        run: npm run check:zip-runtime
      - name: Verify internal Node.js CLI and loopback routing
        run: npm test
      - name: Set up the minimum supported routing runtime
        if: runner.os == 'Linux'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '20.0.0'
          package-manager-cache: false
      - name: Verify Playwright CLI routing on Node.js 20
        if: runner.os == 'Linux'
        run: node --test skills/bdd-local-test/tests/Test-CliRouteProbe.mjs

  verify:
    runs-on: windows-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for WebP tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Check plugin versions
        shell: pwsh
        run: |
          $version = (Get-Content plugin.json -Raw | ConvertFrom-Json).version
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Invalid plugin version: $version"
          }
          foreach ($path in @('.claude-plugin/plugin.json', '.codex-plugin/plugin.json')) {
            $manifest = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            if ($manifest.version -cne $version) { throw "$path version must match plugin.json" }
          }

      - name: Check tag and main ancestry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content plugin.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag must match plugin.json: expected v$version, got $env:GITHUB_REF_NAME"
          }

          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on main' }

      - name: Run Pester tests
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-webp.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          $webp = python skills/bdd-local-test/scripts/lib/bdd_webp.py check | ConvertFrom-Json
          if (-not $webp.ok) { throw 'Pillow WebP encoder is unavailable' }
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
          Import-Module Pester -RequiredVersion 5.6.1 -ErrorAction Stop
          Invoke-Pester -Path skills/bdd-local-test/tests -CI

      - name: Verify concurrent recompression with the pinned Pillow encoder
        run: node --test skills/bdd-local-test/tests/recompress.test.mjs

      - name: Run parallel BDD contract and summary checks
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-ParallelBdd.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Parallel BDD checks failed' }

      - name: Verify issue-scoped BDD selection
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-QualityPlan.ps1
          if ($LASTEXITCODE -ne 0) { throw 'BDD quality plan checks failed' }

      - name: Verify concurrent worktree allocation and Playwright CLI configuration
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-WorktreeCli.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Worktree CLI checks failed' }

      - name: Verify live worktree routing in six named Playwright CLI sessions
        shell: pwsh
        run: |
          $cliRoot = Join-Path $env:RUNNER_TEMP 'bdd-playwright-cli'
          npm install --prefix $cliRoot --no-audit --no-fund --ignore-scripts @playwright/cli@0.1.25
          if ($LASTEXITCODE -ne 0) { throw 'Playwright CLI installation failed' }
          ./skills/bdd-local-test/tests/Test-LoopbackLive.ps1 -CliPath (Join-Path $cliRoot 'node_modules/@playwright/cli/playwright-cli.js') -ChromePath "${env:ProgramFiles}/Google/Chrome/Application/chrome.exe" -OutputDir (Join-Path $env:RUNNER_TEMP 'bdd-live-results')

      - name: Verify automatic BDD ignore rules
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-BddGitignore.ps1
          if ($LASTEXITCODE -ne 0) { throw 'BDD ignore checks failed' }

      - name: Verify cross-project loopback allocation
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-CrossRepoSlot.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Cross-project loopback checks failed' }

      - name: Verify test browser cleanup
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./skills/bdd-local-test/tests/Test-StopSlotServices.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Test browser cleanup checks failed' }

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, verify-internal-cli]
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes
