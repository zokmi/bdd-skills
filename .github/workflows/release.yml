name: Verify and Release

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-internal-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure isolated loopback address on macOS
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.4 netmask 255.255.255.255
      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts
      - name: Check generated configuration validator
        run: npm run check:config-validator
      - name: Check bundled ZIP runtime
        run: npm run check:zip-runtime
      - name: Set up Python for WebP tests
        if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install and verify the pinned WebP encoder
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-webp.txt
          node -e "const {execFileSync} = require('node:child_process'); if (!JSON.parse(execFileSync('python', ['skills/bdd-local-test/scripts/lib/bdd_webp.py', 'check'])).ok) throw Error('Pillow WebP encoder is unavailable')"
      - name: Verify internal Node.js CLI and loopback routing
        run: npm test
      - name: Set up the minimum supported routing runtime
        if: runner.os == 'Linux'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '20.0.0'
          package-manager-cache: false
      - name: Verify Playwright CLI routing on Node.js 20
        if: runner.os == 'Linux'
        run: node --test skills/bdd-local-test/tests/Test-CliRouteProbe.mjs

  verify:
    runs-on: windows-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check plugin versions
        run: node tools/check-release.mjs

      - name: Check tag and main ancestry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: node tools/check-release.mjs --tag "$GITHUB_REF_NAME"

      - name: Verify live worktree routing in six named Playwright CLI sessions
        run: |
          npm install --prefix "$RUNNER_TEMP/bdd-playwright-cli" --no-audit --no-fund --ignore-scripts @playwright/cli@0.1.25
          node skills/bdd-local-test/tests/Test-LoopbackLive.mjs \
            --cli-path "$RUNNER_TEMP/bdd-playwright-cli/node_modules/@playwright/cli/playwright-cli.js" \
            --chrome-path "$PROGRAMFILES/Google/Chrome/Application/chrome.exe" \
            --output-dir "$RUNNER_TEMP/bdd-live-results"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, verify-internal-cli]
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
